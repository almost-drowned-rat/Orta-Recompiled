# release_linux.conf - Orta's names for the toolkit's tools/release/port_release_linux.sh (sourced; its header lists
# every key). Used through tools/release_linux.sh. GAME = the Linux DEV build's game binary whose link line the
# AppImage copies (the player's launcher builds it as data/orta - launcher/main.c, release layout 2026-11-21).
W=~/orta_linux
SLUG=panzer-dragoon-orta-recomp
TARGET=orta_recomp
GAME=ORTA
TITLE="Panzer Dragoon Orta Recomp"
APPIMAGE=Panzer_Dragoon_Orta_Recomp
LICENCE=LICENSE-Orta-recomp-GPL-3.0.txt
PUBLIC_REPO=Orta-Recompiled
DATA="assets/pipelist_orta_pal.bin"
DEPS=~/orta_deps
ICON=assets/icon_256.png
# the LGPL source bundle from a clone of the public toolkit xboxrecomp-option-c at the release tag (beside the toolkit
# worktree: <root>/tools/xboxrecomp_option_c_public, this repo being <root>/projects/orta/orta_recomp)
PUBLIC_TOOLKIT="$(cd "$(dirname "${BASH_SOURCE[0]}")/../../../../tools/xboxrecomp_option_c_public" 2>/dev/null && pwd)"
PUBLIC_TAG=v1.3.2
# RecompLauncher's manifest (maintainer 2026-11-24: in every release), relative to the repo -> the AppDir root
RECOMPLAUNCHER_JSON=recomplauncher.json
